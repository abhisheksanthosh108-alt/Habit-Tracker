<!DOCTYPE html>
<html>
<head>
<title>Habit Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Segoe UI', sans-serif;
}

/* 🌤️ Balanced background */
body {
  height: 100vh;

  background:
    linear-gradient(rgba(255,255,255,0.6), rgba(255,255,255,0.7)),
    url("https://images.unsplash.com/photo-1492724441997-5dc865305da7?q=80&w=1600");

  background-size: cover;
  background-position: center;

  display: flex;
  justify-content: center;
  align-items: center;

  color: #0f172a;
}

/* 🧊 Card with proper contrast */
.card {
  background: rgba(255,255,255,0.95);
  padding: 50px;
  border-radius: 20px;
  text-align: center;
  max-width: 500px;

  box-shadow: 0 20px 50px rgba(0,0,0,0.15);
}

/* Title */
h1 {
  font-size: 42px;
  margin-bottom: 15px;
}

/* Subtitle */
p {
  color: #475569;
  font-size: 16px;
  margin-bottom: 30px;
}

/* Button */
a {
  display: inline-block;
  padding: 14px 30px;
  background: linear-gradient(135deg, #22c55e, #4ade80);
  color: white;
  border-radius: 12px;
  text-decoration: none;
  font-weight: bold;
  transition: 0.3s;
}

a:hover {
  transform: scale(1.05);
  box-shadow: 0 10px 25px rgba(34,197,94,0.4);
}
</style>

</head>

<body>

<div class="card">
  <h1>Habit Tracker</h1>
  <p>Build discipline. Track your daily habits effortlessly.</p>
  <a href="/tracker/">Start Tracking →</a>
</div>

</body>
</html>
